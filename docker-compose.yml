# Local PostgreSQL for development.
#
#   docker compose up -d
#
# Port 5433 is used on the host so this does not clash with any PostgreSQL
# already installed locally on the default 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ngo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ngo
      POSTGRES_PASSWORD: ngolocal
      POSTGRES_DB: ngocommons
    ports:
      - "5433:5432"
    volumes:
      - ngo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngo -d ngocommons"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ngo-pgdata:
